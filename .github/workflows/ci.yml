name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: knip
        run: pnpm knip
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: pnpm test:e2e
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: packages/desktop/playwright-report
          retention-days: 7

  # Unsigned release packages, so packaging breaks show up before a tag does.
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            app: release/mac-arm64/Dark Matter.app/Contents/MacOS/Dark Matter
          - os: ubuntu-latest
            app: release/linux-unpacked/dark-matter
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package (unsigned)
        run: pnpm package
      - name: Packaged smoke test (macOS)
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        env:
          DARK_MATTER_PACKAGED_APP: ${{ github.workspace }}/packages/desktop/${{ matrix.app }}
        run: pnpm exec playwright test e2e/packaged.test.ts
      - name: Packaged smoke test (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        env:
          DARK_MATTER_PACKAGED_APP: ${{ github.workspace }}/packages/desktop/${{ matrix.app }}
        run: xvfb-run --auto-servernum -- pnpm exec playwright test e2e/packaged.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          retention-days: 3
