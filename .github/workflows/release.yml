name: Release

# A version tag (v1.2.3) builds the macOS DMG and zip and the Linux AppImage
# and deb, and attaches them to a draft GitHub release for the maintainer to
# publish. Signing and notarisation credentials come only from repository
# secrets (docs/release.md); without them the packages are built unsigned.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # One macOS runner packages arm64 and x64: install both arches' native binaries (the file watcher's).
      - run: pnpm install --frozen-lockfile ${{ runner.os == 'macOS' && '--cpu=arm64,x64' || '' }}
      - run: pnpm build
      - name: Package
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          # A missing secret arrives as an empty string; unset it so
          # electron-builder skips that step instead of failing on it.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::CSC_LINK is not set: building an unsigned, un-notarised macOS app."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "${CSC_LINK:-}" ] && [ -z "${APPLE_ID:-}" ]; then
            echo "::warning::APPLE_ID is not set: the macOS app is signed but not notarised."
          fi
          # shellcheck disable=SC2086
          pnpm exec electron-builder --publish never $MATRIX_ARGS -c.extraMetadata.version="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes
