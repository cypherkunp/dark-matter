<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <title>Dark Matter</title>
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1"/></filter>
    <clipPath id="tc"><rect x="10" y="10" width="100" height="100" rx="22.4"/></clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3c42"/><stop offset=".55" stop-color="#141417"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity=".06"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#a9abb3"/><stop offset="1" stop-color="#e9eaee"/></linearGradient>
    <radialGradient id="sphere" cx=".36" cy=".28" r=".85"><stop offset="0" stop-color="#6a6b73"/><stop offset=".35" stop-color="#25262b"/><stop offset="1" stop-color="#050506"/></radialGradient>
    <linearGradient id="rimLit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="22.4" fill="#000" filter="url(#sh)"/>
  <rect x="10" y="10" width="100" height="100" rx="22.4" fill="url(#tile)"/>
  <g clip-path="url(#tc)">
    <ellipse cx="60" cy="14" rx="70" ry="34" fill="url(#gloss)"/>
    <circle cx="60" cy="60" r="32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" filter="url(#blur2)"/>
  </g>
  <rect x="10.4" y="10.4" width="99.2" height="99.2" rx="22" fill="none" stroke="url(#rim)" stroke-width=".8"/>
  <circle cx="60" cy="61" r="32" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="2.6" filter="url(#blur1)"/>
  <circle cx="60" cy="60" r="32" fill="none" stroke="url(#silver)" stroke-width="2.4"/>
  <circle cx="60" cy="60" r="20" fill="url(#sphere)"/>
  <circle cx="60" cy="60" r="19.6" fill="none" stroke="url(#rimLit)" stroke-width=".9"/>
  <ellipse cx="52.5" cy="49.5" rx="7" ry="3.8" fill="#fff" fill-opacity=".22" transform="rotate(-32 52.5 49.5)" filter="url(#blur1)"/>
</svg>
